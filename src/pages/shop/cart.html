<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | Wholesale Jamaica</title>
  <link rel="stylesheet" href="/src/styles/globals.css">
</head>
<body class="bg-dark-900">
  <!-- Navigation -->
  <nav class="fixed top-0 w-full bg-dark-900/80 backdrop-blur-md border-b border-dark-700 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center space-x-2">
        <div class="w-8 h-8 bg-gradient-to-br from-primary-600 to-accent-blue rounded-lg"></div>
        <span class="font-satoshi font-bold text-lg">Wholesale JM</span>
      </a>
      <a href="#" class="text-primary-600">🛒 Cart</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="pt-20 max-w-7xl mx-auto px-4 py-12">
    <h1 class="text-4xl font-bold mb-12">Shopping Cart</h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Cart Items -->
      <div class="lg:col-span-2 reveal">
        <div id="cart-items" class="space-y-4">
          <!-- Loading state -->
          <div class="card text-center py-12">
            <p class="text-gray-400">Loading cart...</p>
          </div>
        </div>
      </div>

      <!-- Cart Summary -->
      <div class="lg:col-span-1">
        <div class="card-sticky sticky top-24" style="position: sticky;">
          <h2 class="text-2xl font-bold mb-6">Order Summary</h2>
          
          <div class="space-y-4 mb-6 pb-6 border-b border-dark-700">
            <div class="flex justify-between text-gray-400">
              <span>Subtotal</span>
              <span id="subtotal">$0.00</span>
            </div>
            <div class="flex justify-between text-gray-400">
              <span>Bulk Discount</span>
              <span id="discount" class="text-accent-green">-$0.00</span>
            </div>
            <div class="flex justify-between text-gray-400">
              <span>Shipping</span>
              <span id="shipping">Calculated</span>
            </div>
            <div class="flex justify-between text-gray-400">
              <span>Tax</span>
              <span id="tax">$0.00</span>
            </div>
          </div>

          <div class="flex justify-between text-xl font-bold mb-6">
            <span>Total</span>
            <span id="total">$0.00</span>
          </div>

          <button class="w-full btn btn-primary mb-3" id="checkout-btn">Proceed to Checkout</button>
          <button class="w-full btn btn-secondary" onclick="window.location.href='/products'">Continue Shopping</button>

          <!-- Info -->
          <div class="mt-6 p-4 bg-dark-700 rounded-lg text-sm text-gray-400">
            <p>✓ Free shipping on orders over $5,000</p>
            <p>✓ Same-day delivery in Kingston</p>
            <p>✓ 30-day return policy</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { fetchWithAuth } from '/src/services/authService.js';

    async function loadCart() {
      const items = window.cart?.items || [];
      
      if (items.length === 0) {
        document.getElementById('cart-items').innerHTML = `
          <div class="card text-center py-12">
            <p class="text-xl text-gray-400 mb-4">Your cart is empty</p>
            <button class="btn btn-primary" onclick="window.location.href='/products'">Start Shopping</button>
          </div>
        `;
        return;
      }

      const cartHTML = items.map(item => `
        <div class="card flex justify-between items-start">
          <div class="flex-1">
            <h3 class="font-bold text-lg">${item.name}</h3>
            <p class="text-gray-400 text-sm my-2">SKU: ${item.id}</p>
            <p class="text-primary-600">$${(item.price).toFixed(2)} per unit</p>
          </div>
          
          <div class="flex items-center space-x-4">
            <div class="flex items-center border border-dark-600 rounded-lg">
              <button class="px-3 py-2 hover:bg-dark-700" data-decrease="${item.id}">−</button>
              <span class="px-4 py-2 bg-dark-700">${item.quantity}</span>
              <button class="px-3 py-2 hover:bg-dark-700" data-increase="${item.id}">+</button>
            </div>
            
            <div class="text-right">
              <p class="font-bold text-lg">$${(item.price * item.quantity).toFixed(2)}</p>
              <button class="text-accent-red text-sm hover:underline" data-remove="${item.id}">Remove</button>
            </div>
          </div>
        </div>
      `).join('');

      document.getElementById('cart-items').innerHTML = cartHTML;

      // Add event listeners
      document.querySelectorAll('[data-increase]').forEach(btn => {
        btn.addEventListener('click', () => {
          const productId = btn.getAttribute('data-increase');
          const item = window.cart.items.find(i => i.id === productId);
          if (item) window.cart.updateQuantity(productId, item.quantity + 1);
          loadCart();
        });
      });

      document.querySelectorAll('[data-decrease]').forEach(btn => {
        btn.addEventListener('click', () => {
          const productId = btn.getAttribute('data-decrease');
          const item = window.cart.items.find(i => i.id === productId);
          if (item) window.cart.updateQuantity(productId, item.quantity - 1);
          loadCart();
        });
      });

      document.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', () => {
          const productId = btn.getAttribute('data-remove');
          window.cart.removeItem(productId);
          loadCart();
        });
      });

      updateSummary();
    }

    function updateSummary() {
      const subtotal = window.cart.getTotal();
      const discount = subtotal > 5000 ? subtotal * 0.1 : 0;
      const tax = (subtotal - discount) * 0.15;
      const total = subtotal - discount + tax;

      document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
      document.getElementById('discount').textContent = `-$${discount.toFixed(2)}`;
      document.getElementById('tax').textContent = `$${tax.toFixed(2)}`;
      document.getElementById('total').textContent = `$${total.toFixed(2)}`;
      document.getElementById('shipping').textContent = subtotal > 5000 ? 'Free' : '$500.00';
    }

    document.getElementById('checkout-btn')?.addEventListener('click', () => {
      window.location.href = '/checkout';
    });

    loadCart();
  </script>
</body>
</html>
