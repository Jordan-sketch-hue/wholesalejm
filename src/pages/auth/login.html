<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Wholesale Jamaica</title>
  <link rel="stylesheet" href="/src/styles/globals.css">
</head>
<body>
  <div class="min-h-screen flex items-center justify-center px-4 bg-dark-900">
    <div class="w-full max-w-md">
      <!-- Header -->
      <div class="text-center mb-12">
        <div class="w-12 h-12 bg-gradient-to-br from-primary-600 to-accent-blue rounded-lg mx-auto mb-4"></div>
        <h1 class="text-3xl font-bold">Wholesale Jamaica</h1>
        <p class="text-gray-400 mt-2">Login to your account</p>
      </div>

      <!-- Login Form -->
      <form class="space-y-4" id="login-form">
        <div>
          <label class="block text-sm font-medium mb-2">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required class="w-full px-4 py-3 bg-dark-800 border border-dark-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-primary-600 focus:ring-2 focus:ring-primary-600/30">
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Password</label>
          <input type="password" id="password" placeholder="••••••••" required class="w-full px-4 py-3 bg-dark-800 border border-dark-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-primary-600 focus:ring-2 focus:ring-primary-600/30">
        </div>

        <div class="flex items-center justify-between">
          <label class="flex items-center">
            <input type="checkbox" class="w-4 h-4 bg-dark-800 border border-dark-700 rounded">
            <span class="ml-2 text-sm text-gray-400">Remember me</span>
          </label>
          <a href="#" class="text-sm text-primary-600 hover:text-primary-500">Forgot password?</a>
        </div>

        <button type="submit" class="w-full btn btn-primary">Sign In</button>
      </form>

      <!-- OAuth Buttons -->
      <div class="mt-8">
        <div class="relative mb-6">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-dark-700"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-2 bg-dark-900 text-gray-400">Or continue with</span>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
          <button type="button" class="flex justify-center p-3 border border-dark-700 rounded-lg hover:border-primary-600 transition-colors" id="google-btn">
            <span class="text-2xl">🔒</span>
          </button>
          <button type="button" class="flex justify-center p-3 border border-dark-700 rounded-lg hover:border-primary-600 transition-colors" id="apple-btn">
            <span class="text-2xl">🍎</span>
          </button>
          <button type="button" class="flex justify-center p-3 border border-dark-700 rounded-lg hover:border-primary-600 transition-colors" id="facebook-btn">
            <span class="text-2xl">👤</span>
          </button>
        </div>
      </div>

      <!-- Register Link -->
      <div class="mt-8 text-center">
        <p class="text-gray-400">Don't have an account? <a href="/register" class="text-primary-600 hover:text-primary-500 font-medium">Sign up</a></p>
      </div>
    </div>
  </div>

  <!-- Error Message -->
  <div id="error-message" class="fixed bottom-4 right-4 bg-accent-red text-white px-6 py-3 rounded-lg hidden"></div>

  <script type="module">
    import { loginUser, loginWithOAuth } from '/src/services/authService.js';

    const loginForm = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-message');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const result = await loginUser(email, password);
        if (result.token) {
          localStorage.setItem('token', result.token);
          localStorage.setItem('user', JSON.stringify(result.user));
          window.location.href = '/dashboard';
        }
      } catch (error) {
        showError(error.message);
      }
    });

    document.getElementById('google-btn').addEventListener('click', () => {
      loginWithOAuth('google');
    });

    document.getElementById('apple-btn').addEventListener('click', () => {
      loginWithOAuth('apple');
    });

    document.getElementById('facebook-btn').addEventListener('click', () => {
      loginWithOAuth('facebook');
    });

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.remove('hidden');
      setTimeout(() => {
        errorMessage.classList.add('hidden');
      }, 5000);
    }
  </script>
</body>
</html>
