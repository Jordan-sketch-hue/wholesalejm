<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Wholesale Jamaica</title>
  <link rel="stylesheet" href="/src/styles/globals.css">
</head>
<body>
  <div class="min-h-screen flex items-center justify-center px-4 bg-dark-900 py-12">
    <div class="w-full max-w-md">
      <!-- Header -->
      <div class="text-center mb-12">
        <div class="w-12 h-12 bg-gradient-to-br from-primary-600 to-accent-blue rounded-lg mx-auto mb-4"></div>
        <h1 class="text-3xl font-bold">Create Account</h1>
        <p class="text-gray-400 mt-2">Join Jamaica's wholesale network</p>
      </div>

      <!-- Registration Form -->
      <form class="space-y-4" id="register-form">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium mb-2">First Name</label>
            <input type="text" id="firstName" placeholder="John" required class="w-full px-4 py-3 bg-dark-800 border border-dark-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-primary-600 focus:ring-2 focus:ring-primary-600/30">
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">Last Name</label>
            <input type="text" id="lastName" placeholder="Doe" required class="w-full px-4 py-3 bg-dark-800 border border-dark-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-primary-600 focus:ring-2 focus:ring-primary-600/30">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Business Name</label>
          <input type="text" id="businessName" placeholder="Your Business" required class="w-full px-4 py-3 bg-dark-800 border border-dark-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-primary-600 focus:ring-2 focus:ring-primary-600/30">
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Business Type</label>
          <select id="businessType" required class="w-full px-4 py-3 bg-dark-800 border border-dark-700 rounded-lg text-white focus:outline-none focus:border-primary-600 focus:ring-2 focus:ring-primary-600/30">
            <option value="">Select a type...</option>
            <option value="restaurant">Restaurant</option>
            <option value="supermarket">Supermarket</option>
            <option value="minimart">Mini Mart</option>
            <option value="reseller">Reseller</option>
            <option value="wholesale">Wholesale</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required class="w-full px-4 py-3 bg-dark-800 border border-dark-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-primary-600 focus:ring-2 focus:ring-primary-600/30">
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Phone Number</label>
          <input type="tel" id="phone" placeholder="+1 (876) 555-0000" required class="w-full px-4 py-3 bg-dark-800 border border-dark-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-primary-600 focus:ring-2 focus:ring-primary-600/30">
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Password</label>
          <input type="password" id="password" placeholder="••••••••" required class="w-full px-4 py-3 bg-dark-800 border border-dark-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-primary-600 focus:ring-2 focus:ring-primary-600/30">
          <p class="text-xs text-gray-400 mt-2">Minimum 8 characters</p>
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="••••••••" required class="w-full px-4 py-3 bg-dark-800 border border-dark-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-primary-600 focus:ring-2 focus:ring-primary-600/30">
        </div>

        <label class="flex items-center">
          <input type="checkbox" required>
          <span class="ml-2 text-sm text-gray-400">I agree to the <a href="#" class="text-primary-600">Terms of Service</a> and <a href="#" class="text-primary-600">Privacy Policy</a></span>
        </label>

        <button type="submit" class="w-full btn btn-primary">Create Account</button>
      </form>

      <!-- Login Link -->
      <div class="mt-8 text-center">
        <p class="text-gray-400">Already have an account? <a href="/login" class="text-primary-600 hover:text-primary-500 font-medium">Sign in</a></p>
      </div>
    </div>
  </div>

  <!-- Error Message -->
  <div id="error-message" class="fixed bottom-4 right-4 bg-accent-red text-white px-6 py-3 rounded-lg hidden"></div>

  <script type="module">
    import { registerUser } from '/src/services/authService.js';

    const registerForm = document.getElementById('register-form');
    const errorMessage = document.getElementById('error-message');

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showError('Passwords do not match');
        return;
      }

      if (password.length < 8) {
        showError('Password must be at least 8 characters');
        return;
      }

      try {
        const result = await registerUser({
          firstName: document.getElementById('firstName').value,
          lastName: document.getElementById('lastName').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          password,
          businessName: document.getElementById('businessName').value,
          businessType: document.getElementById('businessType').value
        });

        if (result.token) {
          localStorage.setItem('token', result.token);
          localStorage.setItem('user', JSON.stringify(result.user));
          window.location.href = '/dashboard';
        }
      } catch (error) {
        showError(error.message);
      }
    });

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.remove('hidden');
      setTimeout(() => {
        errorMessage.classList.add('hidden');
      }, 5000);
    }
  </script>
</body>
</html>
